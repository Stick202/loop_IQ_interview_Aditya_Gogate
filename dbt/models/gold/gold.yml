version: 2

models:
  - name: dim_location
    description: One row per city, with requested and model-grid coordinates.
    columns:
      - name: location_id
        data_tests: [not_null, unique]
      - name: grid_latitude
        data_tests: [not_null]

  - name: fct_energy_hourly
    description: Hourly PV yield, wind power density and turbine capacity factor.
    data_tests:
      - unique_grain:
          arguments: {columns: [location_id, valid_at_utc]}
    columns:
      - name: location_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_location'), field: location_id}
      - name: air_density_kg_m3
        data_tests:
          - in_range:
              arguments: {min_value: 1.0, max_value: 1.4}
      - name: pv_yield_kwh_kwp
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1.3}
      - name: wind_cf_100m
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}
      - name: wind_cf_200m
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 1}

  - name: fct_energy_daily
    description: Daily energy facts; totals are null for incomplete local days.
    data_tests:
      - unique_grain:
          arguments: {columns: [location_id, local_date]}
    columns:
      - name: location_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_location'), field: location_id}
      - name: hours_expected
        data_tests:
          - accepted_values:
              arguments: {values: [23, 24, 25], quote: false}
      - name: pv_yield_kwh_kwp
        data_tests:
          - not_null:
              config: {where: "is_complete"}
      - name: wind_cf_100m
        data_tests:
          - not_null:
              config: {where: "is_complete"}

  - name: fct_supply_risk_daily
    description: Daily renewable supply risk score and band, complete days only.
    data_tests:
      - unique_grain:
          arguments: {columns: [location_id, local_date]}
    columns:
      - name: supply_risk_score
        data_tests:
          - not_null
          - in_range:
              arguments: {min_value: 0, max_value: 100}
      - name: risk_band
        data_tests:
          - accepted_values:
              arguments: {values: ["low", "moderate", "high"]}

  - name: rpt_energy_outlook
    description: City comparison over the shared complete window. Feeds the report.
    columns:
      - name: location_id
        data_tests: [not_null, unique]
      - name: days
        data_tests:
          - in_range:
              arguments: {min_value: 14, max_value: 16}

unit_tests:
  - name: turbine_power_curve_and_pv_yield
    model: fct_energy_hourly
    given:
      - input: ref('silver_hourly_weather')
        rows:
          # 1013.25 hPa at 15 degC is standard air, 1.225 kg/m3
          - {location_id: calm, surface_pressure_hpa: 1013.25, temperature_2m_c: 15, gti_wm2: 0, wind_speed_100m_ms: 2, wind_speed_200m_ms: null}
          - {location_id: partial, surface_pressure_hpa: 1013.25, temperature_2m_c: 15, gti_wm2: 800, wind_speed_100m_ms: 8, wind_speed_200m_ms: 24}
          - {location_id: storm, surface_pressure_hpa: 1013.25, temperature_2m_c: 15, gti_wm2: 0, wind_speed_100m_ms: 13, wind_speed_200m_ms: 25}
          - {location_id: missing, surface_pressure_hpa: 1013.25, temperature_2m_c: 15, gti_wm2: null, wind_speed_100m_ms: null, wind_speed_200m_ms: 5}
    expect:
      rows:
        # 8 m/s: (8^3 - 3^3) / (12^3 - 3^3) = 0.2851
        # 800 W/m2 at 15 degC: cell 40 degC, 0.8 * 0.86 * (1 - 0.0035 * 15) = 0.6519
        - {location_id: calm, wind_cf_100m: 0.0, wind_cf_200m: null, pv_yield_kwh_kwp: 0.0}
        - {location_id: partial, wind_cf_100m: 0.2851, wind_cf_200m: 1.0, pv_yield_kwh_kwp: 0.6519}
        - {location_id: storm, wind_cf_100m: 1.0, wind_cf_200m: 0.0, pv_yield_kwh_kwp: 0.0}
        - {location_id: missing, wind_cf_100m: null, wind_cf_200m: 0.0576, pv_yield_kwh_kwp: null}
